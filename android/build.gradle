plugins {
    id 'com.android.library'
}

// AGP 9 compiles Kotlin itself (built-in Kotlin), and when built-in Kotlin is switched off the
// Flutter Gradle plugin (3.44+) applies KGP for us. Only AGP 8 still needs it applied here.
// pluginManager.apply() is used instead of "apply plugin:" so the Flutter tooling does not
// flag this module as a plugin that applies KGP under AGP 9.
def agpMajorVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajorVersion < 9) {
    project.pluginManager.apply('kotlin-android')
}

group = 'com.techind.flutter_sharing_intent'
version = '1.0-SNAPSHOT'

android {
    namespace = 'com.techind.flutter_sharing_intent'
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdk = 21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
